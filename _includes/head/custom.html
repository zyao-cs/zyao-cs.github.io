{% include base_path %}

<!-- start custom head snippets -->



<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link
  href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
  rel="stylesheet"
>


<!-- Support for Academicons -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.css"/>

<!-- favicon from https://commons.wikimedia.org/wiki/File:OOjs_UI_icon_academic-progressive.svg -->
<link rel="apple-touch-icon" sizes="180x180" href="{{ base_path }}/images/apple-touch-icon-180x180.png"/>
<link rel="icon" type="image/svg+xml" href="{{ base_path }}/images/favicon.svg"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-32x32.png" sizes="32x32"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-192x192.png" sizes="192x192"/>
<link rel="manifest" href="{{ base_path }}/images/manifest.json"/>
<link rel="icon" href="/images/favicon.ico"/>
<meta name="theme-color" content="#ffffff"/>

<!-- Fix top blank space: keep the fixed masthead's reserved height in sync
     with its ACTUAL rendered height. The theme hardcodes $masthead-height:70px,
     which no longer matches after the site font size was reduced, leaving a
     large empty band under the nav. This makes the offset self-adjusting for
     any width/zoom/future font change. -->
<style>
  #main { margin-top: 0.75em; } /* theme default is 2em; trimmed to tighten the gap under the nav */

  /* Widen content: the theme caps #main and the nav at $x-large (1280px), which
     leaves large empty side margins on wide screens. Use most of the viewport
     width, with a 1700px ceiling so line length stays readable. */
  #main,
  .masthead__inner-wrap { max-width: min(92%, 1700px); }
</style>
<script>
  (function () {
    function syncMastheadOffset() {
      var m = document.querySelector('.masthead');
      if (m) document.body.style.paddingTop = m.offsetHeight + 'px';
    }
    window.addEventListener('DOMContentLoaded', syncMastheadOffset);
    window.addEventListener('load', syncMastheadOffset);
    window.addEventListener('resize', syncMastheadOffset);
  })();
</script>

<!-- end custom head snippets -->
